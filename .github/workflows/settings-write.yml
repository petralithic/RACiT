name: Desktop settings replacement
on:
  push:
    branches: ['ci/run/racit-settings-write-20261121']
permissions:
  contents: read
jobs:
  settings:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Extract the patched settings writer
        shell: bash
        run: |
          set -euo pipefail
          git init -q tools/ps3recomp
          git -C tools/ps3recomp fetch --depth 1 https://github.com/sp00nznet/ps3recomp.git 5244db92669b54831c6d3ebb7a96d58c4dbfa6df
          git -C tools/ps3recomp -c core.autocrlf=false checkout --detach FETCH_HEAD
          git -C tools/ps3recomp apply --ignore-whitespace --include=libs/video/rsx_host_ui.c --include=libs/video/rsx_host_ui.h ../../patches/ps3recomp-0001-racacit-runtime-fixes.patch
          cp tools/ps3recomp/libs/video/rsx_host_ui.h tests/settings_ui.h
          awk '
            /^static void settings_lines\(/ { emit=1 }
            /^static void settings_save_file\(void\)$/ { emit=1; file=1 }
            emit { print; if ($0 == "}") { emit=0; if (file) { complete=1; exit } } }
            END { if (!complete) exit 1 }
          ' tools/ps3recomp/libs/video/rsx_host_ui.c > tests/settings_source.inc
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
      - name: Exercise read and write failures on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $run = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/settings-write"
          Push-Location $run
          cl /nologo /std:c++17 /EHsc /W4 /D_CRT_SECURE_NO_WARNINGS "$env:GITHUB_WORKSPACE/tests/settings_write_fixture.cpp" /Fecheck.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\check.exe
          exit $LASTEXITCODE
      - name: Exercise read and write failures on POSIX
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          run=$(mktemp -d "$RUNNER_TEMP/settings-write.XXXXXXXX")
          cd "$run"
          c++ -std=c++17 -Wall -Wextra -Werror "$GITHUB_WORKSPACE/tests/settings_write_fixture.cpp" -o check
          ./check
