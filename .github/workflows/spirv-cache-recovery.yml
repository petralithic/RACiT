name: SPIR-V cache recovery
on:
  push:
    branches: ['ci/run/racit-spirv-cache-20261121']
permissions:
  contents: read
jobs:
  cache:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Extract the actual patched cache implementation
        shell: bash
        run: |
          set -euo pipefail
          git init -q tools/ps3recomp
          git -C tools/ps3recomp fetch --depth 1 https://github.com/sp00nznet/ps3recomp.git 5244db92669b54831c6d3ebb7a96d58c4dbfa6df
          git -C tools/ps3recomp -c core.autocrlf=false checkout --detach FETCH_HEAD
          git -C tools/ps3recomp apply --ignore-whitespace --include=libs/video/rsx_shader_spirv.cpp ../../patches/ps3recomp-0001-racacit-runtime-fixes.patch
          awk '/^\/\* SPIR-V cache\./ { emit=1; found=1 }
            /^#else \/\* !PS3RECOMP_HAVE_SPIRV_TRANSLATION/ { emit=0 }
            emit { print }
            END { if (!found || emit) exit 1 }' \
            tools/ps3recomp/libs/video/rsx_shader_spirv.cpp > tests/spirv_cache_source.inc
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
      - name: Exercise the Windows cache
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $run = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/spirv-cache"
          cl /nologo /std:c++17 /EHsc /W4 /D_CRT_SECURE_NO_WARNINGS tests/spirv_cache_fixture.cpp /Fe"$run/check.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Set-Location $run
          & "./check.exe"
          exit $LASTEXITCODE
      - name: Exercise the native cache
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          run=$(mktemp -d "$RUNNER_TEMP/spirv-cache.XXXXXXXX")
          c++ -std=c++17 -O2 -Wall -Wextra tests/spirv_cache_fixture.cpp -o "$run/check"
          cd "$run"
          ./check
