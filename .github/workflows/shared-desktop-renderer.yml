name: Shared desktop renderer integration
on:
  push:
    branches: ['ci/run/racit-shared-renderer-20261121']
permissions:
  contents: read
env:
  PS3RECOMP_COMMIT: 5244db92669b54831c6d3ebb7a96d58c4dbfa6df   # scripts/setup_windows.sh
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install the native Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libvulkan-dev glslang-dev glslang-tools spirv-tools zlib1g-dev ninja-build
      - name: Compile the patched Linux runtime
        run: |
          git init -q tools/ps3recomp
          git -C tools/ps3recomp fetch --depth 1 https://github.com/sp00nznet/ps3recomp.git "$PS3RECOMP_COMMIT"
          git -C tools/ps3recomp checkout --detach FETCH_HEAD
          git -C tools/ps3recomp apply --ignore-whitespace ../../patches/ps3recomp-0001-racacit-runtime-fixes.patch
          cmake -S tools/ps3recomp -B build/runtime -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPS3RECOMP_RSX_VULKAN=ON -DPS3RECOMP_BUILD_TESTS=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_FLAGS="-ffunction-sections -fdata-sections"
          grep -q PS3RECOMP_HAVE_SPIRV_TRANSLATION build/runtime/compile_commands.json
          cmake --build build/runtime --target ps3recomp_runtime --parallel 2

      - name: Verify sparse texture slot visits and descriptor keys
        run: |
          python3 -B - <<'PYTEST'
          from pathlib import Path
          src = Path('tools/ps3recomp/libs/video/rsx_vulkan_backend.c').read_text()

          def take(text, first, last):
              start = text.index(first)
              return text[start:text.index(last, start)]

          bind = take(src, 'static void vk_eng_bind_textures(', 'static void vk_eng_bind_vertex_textures(')
          sparse = take(bind, '    /* Include the previous mask', '        const int on')
          ref = bind.replace('vk_eng_bind_textures(', 'reference_bind(').replace(
              sparse, '    for (u32 u = 0; u < RSX_BE_MAX_TEXTURES; u++) {\n')
          counted = bind.replace('vk_eng_bind_textures(', 'count_bind(').replace(
              '        const int on = ', '        ++visits;\n        const int on = ', 1)
          lookup = src[src.index('static VkDescriptorSet vk_eng_set_for('):]
          key = take(lookup, '    u64 h =', '    h |= 1u;')
          sparse_key = take(key, '    u32 units =', '        VK_MIX(s_e2.tex[u]);')
          ref_key = key.replace(sparse_key, '    for (u32 u = 0; u < RSX_MAX_TEXTURES; u++) {\n'
                                            '        if (!((s_e2.tex_mask >> u) & 1u)) continue;\n')

          def hash_function(name, code):
              return f'static u64 {name}(u32 vsb, u32 psb)\n{{\n{code}    return h;\n}}\n'

          header = r'''
          #include <assert.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <string.h>
          typedef uint32_t u32;
          typedef uint64_t u64;
          #define RSX_BE_MAX_TEXTURES 16
          #define RSX_MAX_TEXTURES 16
          #define VK_ENG_MAX_OBJ 97
          typedef struct { u32 vals[6]; } rsx_be_sampler_desc;
          typedef struct {
              u32 tex_mask, tex_dirty;
              u32 tex[16]; rsx_be_sampler_desc samp[16];
          } state;
          static state s_e2, reference, actual;
          static struct { int lazy; } s_eobj[VK_ENG_MAX_OBJ];
          static u32 s_eobj_gen, visits, lazy_path;
          static int vk_eng_color_back(void* object)
          { (void)object; lazy_path++; return 1; }
          '''
          body = r'''
          int main(void)
          {
              u32 textures[16];
              rsx_be_sampler_desc samplers[16];
              for (u32 j = 1; j < VK_ENG_MAX_OBJ; j++) s_eobj[j].lazy = (j % 5u) == 0;
              for (u32 i = 0; i < 65536u; i++) {
                  const u32 mask = ((i * 129u + 13u) & 65535u) | ((i & 1u) << 26);
                  for (u32 t = 0; t < 16; t++) {
                      textures[t] = (i + t * 31u) % 101u;
                      for (u32 k = 0; k < 6; k++) samplers[t].vals[k] = (i / 5u) ^ (31u * t + k);
                  }
                  const rsx_be_sampler_desc* opts = i % 11u ? samplers : NULL;
                  reference.tex_dirty = actual.tex_dirty = 0;
                  s_e2 = reference;
                  lazy_path = 0;
                  reference_bind(NULL, textures, opts, mask);
                  reference = s_e2;
                  const u32 expected_lazy = lazy_path;
                  s_e2 = actual;
                  lazy_path = 0;
                  vk_eng_bind_textures(NULL, textures, opts, mask);
                  actual = s_e2;
                  assert(memcmp(&actual, &reference, sizeof actual) == 0);
                  assert(lazy_path == expected_lazy);
                  s_eobj_gen = i;
                  assert(candidate_key(16, 32) == reference_key(16, 32));
              }
              s_e2 = (state){0};
              visits = 0;
              count_bind(NULL, textures, NULL, 1u << 15);
              assert(visits == 1);
              count_bind(NULL, NULL, NULL, 0);
              assert(visits == 2 && !s_e2.tex[15]);
              puts("Binding state and descriptor keys matched across all 65536 masks. A single active slot required one iteration.");
          }
          '''
          Path('build/texture-slot-check.c').write_text(header + bind + ref + counted +
              hash_function('candidate_key', key) + hash_function('reference_key', ref_key) + body)
          PYTEST
          cc -std=c11 -O2 build/texture-slot-check.c -o build/texture-slot-check
          build/texture-slot-check

  windows-runtime:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Prepare the pinned Windows dependencies
        shell: bash
        run: PYTHON=python bash scripts/setup_windows.sh
      - name: Compile the runtime with the Windows game's Vulkan and glslang configuration
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PWD/tools/venv/Scripts:$PATH"
          mkdir -p build/runtime-driver
          awk '/^# ---- the game/ { exit }
            { sub(/CMAKE_CURRENT_LIST_DIR}\/\.\./, "CMAKE_CURRENT_LIST_DIR}/../.."); print }
          ' windows/CMakeLists.txt > build/runtime-driver/CMakeLists.txt
          cat >> build/runtime-driver/CMakeLists.txt <<'CMAKE'
          add_subdirectory("${RACACIT_ROOT}/tools/ps3recomp" ps3recomp)
          target_include_directories(ps3recomp_runtime PRIVATE "${RACACIT_ROOT}/tools/zlib")
          CMAKE
          cmake -S build/runtime-driver -B build/runtime -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/windows/toolchain/zig-windows.cmake" \
            -DPS3RECOMP_RSX_VULKAN=ON -DPS3RECOMP_WIN_USE_SDL2=ON -DPS3RECOMP_BUILD_TESTS=OFF \
            -DPS3RECOMP_VULKAN_INCLUDE_DIR="$PWD/tools/Vulkan-Headers/include" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          grep -q PS3RECOMP_HAVE_SPIRV_TRANSLATION build/runtime/compile_commands.json
          cmake --build build/runtime --target ps3recomp_runtime --parallel 2
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install dependencies on the hosted runner
        run: brew install sdl2 sdl3 glslang spirv-cross vulkan-headers
      - name: Compile the runtime with Vulkan and glslang
        shell: bash
        run: |
          set -euo pipefail
          bash mac/setup_macos.sh
          cmake -S tools/ps3recomp -B build/runtime -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_PREFIX_PATH="$(brew --prefix);$(brew --prefix sdl2)" \
            -DPS3RECOMP_VULKAN_INCLUDE_DIR="$(brew --prefix vulkan-headers)/include" \
            -DPS3RECOMP_RSX_VULKAN=ON -DPS3RECOMP_BUILD_TESTS=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          grep -q PS3RECOMP_HAVE_SPIRV_TRANSLATION build/runtime/compile_commands.json
          cmake --build build/runtime --target ps3recomp_runtime --parallel 2
