name: Windows cellPad compile
on:
  push:
    branches: [ci/windows-cellpad]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cellpad:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pinned SDK with this branch's runtime patch
        shell: bash
        run: |
          git init -q sdk && cd sdk
          git remote add origin https://github.com/sp00nznet/ps3recomp.git
          git fetch -q --depth 1 origin 5244db92669b54831c6d3ebb7a96d58c4dbfa6df
          git checkout -q FETCH_HEAD
          git apply --ignore-whitespace ../patches/ps3recomp-0001-racacit-runtime-fixes.patch
      - name: Zig and SDL2
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: ziglang==0.16.0
          $v = '2.30.11'
          Invoke-WebRequest "https://github.com/libsdl-org/SDL/releases/download/release-$v/SDL2-devel-$v-mingw.zip" -OutFile sdl.zip
          Expand-Archive sdl.zip -DestinationPath sdl
      - name: Compile cellPad.c for Windows (SDL2 pad backend)
        shell: bash
        run: |
          python -m ziglang cc -target x86_64-windows-gnu -std=gnu17 -O2 -c sdk/libs/input/cellPad.c \
            -Isdk/include -Isdk -Isdk/runtime -Isdk/libs -Isdl/SDL2-2.30.11/x86_64-w64-mingw32/include \
            -DPS3RECOMP_PAD_USE_SDL2=1 -o cellPad.o
          ls -la cellPad.o
