name: Vulkan cache replacement check
on:
  push:
    branches: ['ci/run/racit-cache-replacement-20261121']
permissions:
  contents: read
jobs:
  cache:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Extract the cache functions from the runtime patch
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /^\+static (FILE\* vk_open_cache_tmp|int vk_finish_cache_write|int SDLCALL vk_pcache_save_thread|int vk_rewrite_file)\(/ { emit=1; count++ }
            emit { line=substr($0, 2); print line; if (line == "}") emit=0 }
            END { if (count != 4 || emit) exit 1 }
          ' patches/ps3recomp-0001-racacit-runtime-fixes.patch > tests/cache_write_source.inc
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
      - name: Verify native replacement with MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $run = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/pipeline-cache-fixture"
          cl /nologo /TC /std:c11 /W4 /WX /D_CRT_SECURE_NO_WARNINGS tests/cache_write_fixture.c /Fe"$run/check.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Set-Location $run
          & "./check.exe"
          exit $LASTEXITCODE
      - name: Verify native replacement with the system C compiler
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          run=$(mktemp -d "$RUNNER_TEMP/pipeline-cache.XXXXXXXX")
          cc -std=c11 -Wall -Wextra -Werror tests/cache_write_fixture.c -o "$run/check"
          cd "$run"
          ./check
