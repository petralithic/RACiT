name: Quick Select view boundaries across desktop backends
on:
  push:
    branches: ['ci/run/racit-wheel-gadget-20261121']
permissions:
  contents: read
jobs:
  scroll:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: runner.os == 'Windows'
        with:
          repository: libsdl-org/SDL
          ref: 5d249570393f7a37e037abf22cd6012a4cc56a71
          path: tools/wheel-sdl
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: runner.os == 'macOS'
        with:
          repository: libsdl-org/SDL
          ref: f00dc919ca35b9756316e86c4777392de442f9b2
          path: tools/wheel-sdl
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: runner.os == 'macOS'
        with:
          repository: libsdl-org/sdl2-compat
          ref: e4df8a55f20da762290a78c2bbe8f8d89d01486a
          path: tools/wheel-compat
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
      - name: Prepare the pinned runtime and SDL2
        shell: bash
        run: |
          set -euo pipefail
          git init -q tools/ps3recomp
          git -C tools/ps3recomp fetch --depth 1 https://github.com/sp00nznet/ps3recomp.git 5244db92669b54831c6d3ebb7a96d58c4dbfa6df
          git -C tools/ps3recomp -c core.autocrlf=false checkout --detach FETCH_HEAD
          git -C tools/ps3recomp apply --ignore-whitespace ../../patches/ps3recomp-0001-racacit-runtime-fixes.patch
          sdl="$PWD/build/wheel-native"
          case "$RUNNER_OS" in
            Linux)
              sudo apt-get update -q
              sudo apt-get install -y libsdl2-dev
              ;;
            Windows)
              cmake -S tools/wheel-sdl -B build/wheel-sdl -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST=OFF -DCMAKE_INSTALL_PREFIX="$sdl"
              cmake --build build/wheel-sdl --target install --parallel 2
              ;;
            macOS)
              cmake -S tools/wheel-sdl -B build/wheel-sdl -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DSDL_X11=OFF \
                -DCMAKE_INSTALL_PREFIX="$sdl" -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
              cmake --build build/wheel-sdl --target install --parallel 2
              cmake -S tools/wheel-compat -B build/wheel-compat -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DSDL2COMPAT_TESTS=OFF -DSDL2COMPAT_STATIC=OFF -DCMAKE_PREFIX_PATH="$sdl" \
                -DCMAKE_INSTALL_PREFIX="$sdl" -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
              cmake --build build/wheel-compat --target install --parallel 2
              ;;
          esac
      - name: Replay real host wheel input with a mock guest and inventory
        shell: bash
        run: |
          python3 -B - <<'PYTEST'
          from pathlib import Path
          source = Path('game/stubs.cpp').read_text()
          a = source.index('// The game\'s Quick Select keeps four pages')
          b = source.index('static uint32_t front_end_movie(', a)
          Path('wheel-check.cpp').write_text(r'''
          #include "rsx_host_ui.h"
          #include <cassert>
          #include <cstdint>
          #include <cstdio>
          #include <cstdlib>
          #include <cstring>
          #include <string>

          static uint8_t mem[1024 * 1024];
          static uint64_t clock_ms = 1000;
          extern "C" {
          volatile int g_racacit_spu_spin_us;
          volatile int g_racacit_present_pace;
          uint64_t racit_fixture_ticks(void) { return clock_ms; }
          void racit_fixture_wheel(uint32_t mouse, float x, float y);
          unsigned long long ps3_qpc_us(void) { return clock_ms * 1000; }
          unsigned cellGcm_flip_request_count(void) { return 0; }
          }
          static uint8_t vm_read8(uint64_t a) { assert(a < sizeof mem); return mem[a]; }
          static uint32_t vm_read32(uint64_t a)
          {
              uint32_t x;
              assert(a + sizeof x <= sizeof mem);
              std::memcpy(&x, mem + a, sizeof x);
              return x;
          }
          static void vm_write32(uint64_t a, uint32_t v)
          {
              assert(a + sizeof v <= sizeof mem);
              std::memcpy(mem + a, &v, sizeof v);
          }
          struct ppu_context { uint64_t gpr[32], ctr; };
          using FrontEndCall = ppu_context;
          static void front_end_enter(ppu_context* ctx, FrontEndCall& save) { save = *ctx; }
          static void front_end_leave(ppu_context* ctx, const FrontEndCall& save) { *ctx = save; }
          static void front_end_drain(ppu_context*) {}
          static constexpr uint32_t player = 0x10000, toc = 0x9000, pool = 0x19000;
          static constexpr uint32_t hero = 0x30000, equipment = hero + 0x2510;
          static constexpr uint32_t table = 0x40000, method = 0x40100, hud = 0x50000, menu = 0x60000;
          static void ps3_indirect_call(ppu_context* ctx)
          {
              assert(ctx->gpr[3] == equipment && ctx->gpr[5] == 0);
              assert(ctx->ctr == 0x73312 && ctx->gpr[2] == 0x55555);
              vm_write32(player + 0x598, ctx->gpr[4]);
          }
          ''' + source[a:b] + r'''
          static void set_option(const char* key, const char* value)
          {
          #ifdef _WIN32
              assert(_putenv_s(key, value) == 0);
          #else
              assert(setenv(key, value, 1) == 0);
          #endif
          }
          static void feed(const char* line)
          {
              FILE* f = std::fopen("wheel-script.txt", "wb");
              assert(f);
              std::fprintf(f, "%s\n", line);
              std::fclose(f);
              clock_ms += 60;
              rsx_host_ui_poll_script();
          }
          static void expect_equipped(uint32_t wanted)
          {
              assert(vm_read32(player + 0x598) == wanted);
          }
          int main(int argc, char** argv)
          {
              assert(argc == 2);
              const std::string mode = argv[1];
              set_option("PAD_IGNORE_REAL", "1");
              set_option("RACACIT_UI_FILE", "wheel-script.txt");
              if (mode == "slow") set_option("RACACIT_SCROLL_SENS", "50");
              if (mode == "off") set_option("RACACIT_WEAPON_SCROLL", "0");
              if (mode == "touchpad") set_option("RACACIT_WEAPON_SCROLL", "2");
              rsx_host_ui_enable_weapon_scroll();
              rsx_host_ui_load_options();

              ppu_context ctx = {};
              ctx.gpr[2] = toc;
              vm_write32(toc - 0x733C, pool);
              vm_write32(pool - 0x8000, player);
              vm_write32(equipment, table);
              vm_write32(table + 0x1C, method);
              vm_write32(method, 0x73312);
              vm_write32(method + 4, 0x55555);
              for (int i = 0; i < 32; ++i) {
                  vm_write32(player + 0x3C0 + i * 4, UINT32_MAX);
                  vm_write32(menu + 0x8784 + i * 4, UINT32_MAX);
              }
              for (int id : {2, 4, 6, 8}) mem[player + 0x10 + 0x18 * id + 0x15] = 1;
              const uint32_t choices[][2] = {{0, 2}, {2, 7}, {5, 4}, {8, 8}, {16, 24}, {24, 6}};
              for (const auto& pair : choices) {
                  vm_write32(player + 0x3C0 + pair[0] * 4, pair[1]);
                  vm_write32(menu + 0x8784 + pair[0] * 4, pair[1]);
              }
              vm_write32(player + 0x598, 2);
              auto equip = [&](const char* command, uint32_t wanted) {
                  feed(command);
                  racit_scroll_equip(&ctx, hud, hero);
                  expect_equipped(wanted);
                  assert(ctx.gpr[2] == toc);
              };
              if (mode == "off") {
                  equip("wheel -1", 2);
                  int dx, dy, legacy; unsigned buttons;
                  assert(rsx_host_ui_mouse_take(&dx, &dy, &legacy, &buttons) && legacy == -1);
              } else if (mode == "slow") {
                  mem[menu + 0x8B78] = 1;
                  mem[hud + 0x3858 + 0x8B77] = 1;
                  vm_write32(menu + 0x8804, 4);
                  feed("wheel -1");
                  assert(racit_scroll_quick_select(&ctx, menu) == -1);
                  mem[menu + 0x8B78] = 0;
                  mem[hud + 0x3858 + 0x8B77] = 0;
                  equip("wheel -1", 2);
                  clock_ms += 350;
                  racit_scroll_equip(&ctx, hud, hero);
                  expect_equipped(2);
                  equip("wheel -1", 4);
                  feed("wheel 3");
                  clock_ms += 350;
                  racit_scroll_equip(&ctx, hud, hero);
                  expect_equipped(4);
                  equip("wheel 1", 2);
                  equip("wheel -1", 2);
                  clock_ms += 350;
                  equip("wheel -1", 4);
              } else if (mode == "touchpad") {
                  equip("wheel -3 touchpad", 2);
                  clock_ms += 350;
                  equip("wheel -1 touchpad", 2);
                  equip("wheel -3 touchpad", 4);
                  clock_ms += 60;
                  racit_fixture_wheel(5, 0.5f, -4.0f);
                  racit_scroll_equip(&ctx, hud, hero);
                  expect_equipped(8);
              } else {
                  assert(mode == "default");
                  equip("wheel -1", 4);
                  equip("wheel -1", 8);
                  equip("wheel -1", 6);
                  equip("wheel -1", 2);
                  equip("wheel 1", 6);
                  equip("wheel -4 touchpad", 6);
                  equip("wheel -1", 2);
                  equip("wheel 1", 6);
                  auto wheel = [&](uint32_t mouse, float x, float y, uint32_t wanted) {
                      clock_ms += 60;
                      racit_fixture_wheel(mouse, x, y);
                      racit_scroll_equip(&ctx, hud, hero);
                      expect_equipped(wanted);
                  };
                  wheel(7, 0.5f, -1.0f, 6);
                  wheel(7, 0.0f, -1.0f, 6);
                  wheel(8, 0.0f, -1.0f, 2);
                  equip("wheel 1", 6);
                  feed("wheel -1");
                  clock_ms += 260;
                  racit_scroll_equip(&ctx, hud, hero);
                  expect_equipped(6);

                  mem[hud + 0x3858 + 0x8B77] = 1;
                  vm_write32(menu + 0x8804, 4);
                  vm_write32(menu + 0x8B68, 0);
                  vm_write32(menu + 0x8B60, 5);
                  equip("wheel -1", 6);
                  assert(racit_scroll_quick_select(&ctx, menu) == 0);
                  assert(vm_read32(menu + 0x8B68) == 1);
                  vm_write32(menu + 0x8B60, 0);
                  equip("wheel 1", 6);
                  assert(racit_scroll_quick_select(&ctx, menu) == 5);
                  assert(vm_read32(menu + 0x8B68) == 0);
                  expect_equipped(6);

                  mem[menu + 0x8B78] = 1;
                  feed("wheel -1");
                  assert(racit_scroll_quick_select(&ctx, menu) == -1);
                  mem[menu + 0x8B78] = 0;
                  mem[hud + 0x3858 + 0x8B77] = 0;
                  racit_scroll_equip(&ctx, hud, hero);
                  expect_equipped(6);

                  vm_write32(menu + 0x8804, 0);
                  feed("wheel -1");
                  assert(racit_scroll_quick_select(&ctx, menu) == -1);
                  vm_write32(menu + 0x8804, 4);
                  assert(racit_scroll_quick_select(&ctx, menu) == -1);

                  set_option("PAD_IGNORE_REAL", "");
                  equip("wheel -1", 6);
              }
              std::printf("Offscreen scroll replay passed for %s\n", argv[1]);
          }
          ''')
          PYTEST
          cat >wheel-ui.c <<'EOF'
          #include "tools/ps3recomp/libs/video/rsx_host_ui.c"
          #include <assert.h>
          #ifdef RACIT_TEST_COMPAT
          int push_sdl3_wheel(uint32_t mouse, float x, float y);
          #endif
          void racit_fixture_wheel(uint32_t mouse, float x, float y)
          {
          #ifdef RACIT_TEST_COMPAT
              if (!SDL_WasInit(SDL_INIT_EVENTS)) assert(SDL_InitSubSystem(SDL_INIT_EVENTS) == 0);
              assert(push_sdl3_wheel(mouse, x, y));
              SDL_Event event;
              assert(SDL_PeepEvents(&event, 1, SDL_GETEVENT, SDL_MOUSEWHEEL, SDL_MOUSEWHEEL) == 1);
              assert(event.wheel.preciseX == x && event.wheel.preciseY == y && event.wheel.which == mouse);
              captured_mouse_wheel(&event.wheel, 1);
          #else
              SDL_MouseWheelEvent event = {
                  .which = mouse, .x = (int)x, .y = (int)y, .preciseX = x, .preciseY = y
              };
              captured_mouse_wheel(&event, 1);
          #endif
          }
          EOF
          sdl="$PWD/build/wheel-native"
          if [[ "$RUNNER_OS" == Windows ]]; then
            clang --target=x86_64-pc-windows-msvc -std=gnu17 -I"$sdl/include" \
              -DSDL_GetTicks64=racit_fixture_ticks -c wheel-ui.c -o wheel-ui.obj
            MSYS2_ARG_CONV_EXCL='*' cl.exe /nologo /std:c++17 /EHsc \
              /Itools/ps3recomp/libs/video /Fewheel-check.exe wheel-check.cpp wheel-ui.obj \
              build/wheel-native/lib/SDL2.lib gdi32.lib
            cp "$sdl/bin/SDL2.dll" .
          else
            if [[ "$RUNNER_OS" == macOS ]]; then
              cat >sdl3-wheel.c <<'EOF'
          #include <SDL3/SDL.h>
          #include <assert.h>
          #include <dlfcn.h>
          #include <stdlib.h>
          int push_sdl3_wheel(uint32_t mouse, float x, float y)
          {
              static void *sdl;
              if (!sdl) sdl = dlopen(getenv("RACIT_TEST_SDL3"), RTLD_NOW | RTLD_LOCAL);
              assert(sdl);
              bool (*push)(SDL_Event *) = dlsym(sdl, "SDL_PushEvent");
              assert(push);
              SDL_Event event = {0};
              event.wheel.type = SDL_EVENT_MOUSE_WHEEL;
              event.wheel.which = mouse;
              event.wheel.x = x;
              event.wheel.y = y;
              event.wheel.integer_x = (int)x;
              event.wheel.integer_y = (int)y;
              return push(&event);
          }
          EOF
              export DYLD_LIBRARY_PATH="$sdl/lib"
              export RACIT_TEST_SDL3="$sdl/lib/libSDL3.dylib"
              cc -std=gnu17 -I"$sdl/include" -c sdl3-wheel.c -o sdl3-wheel.o
              cc -std=gnu17 -I"$sdl/include" -DRACIT_TEST_COMPAT \
                -DSDL_GetTicks64=racit_fixture_ticks -c wheel-ui.c -o wheel-ui.o
              c++ -std=c++17 -Itools/ps3recomp/libs/video wheel-check.cpp wheel-ui.o sdl3-wheel.o \
                -L"$sdl/lib" -lSDL2 -Wl,-rpath,"$sdl/lib" -o wheel-check.exe
            else
              cc -std=gnu17 -DSDL_GetTicks64=racit_fixture_ticks -c wheel-ui.c -o wheel-ui.o
              c++ -std=c++17 -Itools/ps3recomp/libs/video wheel-check.cpp wheel-ui.o -lSDL2 -lm -o wheel-check.exe
            fi
          fi
          for mode in default slow off touchpad; do ./wheel-check.exe "$mode"; done
