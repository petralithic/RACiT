name: Windows Unicode game paths
on:
  push:
    branches: ['ci/run/racit-unicode-paths-20261121']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: windows-2025
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        toolchain: [zig, msvc]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - if: matrix.toolchain == 'zig'
        run: python -m pip install ziglang==0.16.0 ninja==1.13.2
      - run: python -B tests/windows_unicode_path_fixture.py ${{ matrix.toolchain }}
