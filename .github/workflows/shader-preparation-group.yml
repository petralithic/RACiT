name: Grouped shader preparation
on:
  push:
    branches: ['ci/run/racit-shader-group-20261121']
permissions:
  contents: read
jobs:
  prepare:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Extract the applied shader preparation worker and ordering
        shell: bash
        run: |
          set -euo pipefail
          git init -q tools/ps3recomp
          git -C tools/ps3recomp fetch --depth 1 https://github.com/sp00nznet/ps3recomp.git 5244db92669b54831c6d3ebb7a96d58c4dbfa6df
          git -C tools/ps3recomp -c core.autocrlf=false checkout --detach FETCH_HEAD
          git -C tools/ps3recomp apply --ignore-whitespace --include=libs/video/rsx_vulkan_backend.c ../../patches/ps3recomp-0001-racacit-runtime-fixes.patch
          src=tools/ps3recomp/libs/video/rsx_vulkan_backend.c
          awk '
            /^typedef struct vk_vdesc \{/ { emit=1 }
            /^typedef struct \{ u64 hash; u32 words; long off; \} vk_pw_spv;/ { print }
            /^static (int vk_pw_spv_cmp|vk_pw_spv\* vk_pw_find|int vk_prep_variant_cmp)\(/ { emit=1 }
            emit { print }
            /^}( vk_vdesc;)?$/ { emit=0 }
          ' "$src" > tests/prep_group_types.inc
          awk '/^static int SDLCALL vk_prep_worker\(/ { emit=1 }
               emit { print; if ($0 == "}") exit }' "$src" > tests/prep_group_worker.inc
          awk '/qsort\(s_pw.recs, n, sizeof \*s_pw.recs, vk_prep_variant_cmp\)/ { print; found=1 }
               END { if (!found) exit 1 }' "$src" > tests/prep_group_sort.inc
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
      - name: Compare module calls and check worker coverage on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $run = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/shader-group"
          Push-Location $run
          cl /nologo /std:c++17 /EHsc /W4 /D_CRT_SECURE_NO_WARNINGS "$env:GITHUB_WORKSPACE/tests/prep_group_fixture.cpp" /Fecheck.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\check.exe
          exit $LASTEXITCODE
      - name: Compare module calls and check worker coverage on POSIX
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          run=$(mktemp -d "$RUNNER_TEMP/shader-group.XXXXXXXX")
          cd "$run"
          c++ -std=c++17 -Wall -Wextra -Werror -pthread "$GITHUB_WORKSPACE/tests/prep_group_fixture.cpp" -o check
          ./check
