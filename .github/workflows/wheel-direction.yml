name: Desktop wheel direction
on:
  push:
    branches: ['ci/run/racit-wheel-direction-20261121']
permissions:
  contents: read
jobs:
  input:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: libsdl-org/SDL
          ref: 5d249570393f7a37e037abf22cd6012a4cc56a71
          path: test-sdl
          sparse-checkout: include
          persist-credentials: false
      - name: Extract the gameplay wheel handler and mouse poll from the applied patch
        shell: bash
        run: |
          set -euo pipefail
          git init -q tools/ps3recomp
          git -C tools/ps3recomp fetch --depth 1 https://github.com/sp00nznet/ps3recomp.git 5244db92669b54831c6d3ebb7a96d58c4dbfa6df
          git -C tools/ps3recomp -c core.autocrlf=false checkout --detach FETCH_HEAD
          git -C tools/ps3recomp apply --ignore-whitespace --include=libs/video/rsx_host_ui.c ../../patches/ps3recomp-0001-racacit-runtime-fixes.patch
          file=tools/ps3recomp/libs/video/rsx_host_ui.c
          awk '/^    case SDL_MOUSEWHEEL:$/ { emit=1; found=1 }
               emit && /case SDL_WINDOWEVENT:/ { complete=1; exit }
               emit { print }
               END { if (!found || !complete) exit 1 }' "$file" > tests/wheel_source.inc
          awk '/^int rsx_host_ui_mouse_take\(/ { emit=1; found=1 }
               emit { print; if ($0 == "}") { complete=1; exit } }
               END { if (!found || !complete) exit 1 }' "$file" > tests/mouse_take_source.inc
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
      - name: Verify flipped and normal wheel events on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $run = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/wheel-direction"
          cl /nologo /std:c++17 /EHsc /W4 /Itest-sdl/include tests/wheel_direction_fixture.cpp /Fe"$run/check.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$run/check.exe"
          exit $LASTEXITCODE
      - name: Verify flipped and normal wheel events natively
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          run=$(mktemp -d "$RUNNER_TEMP/wheel-direction.XXXXXXXX")
          c++ -std=c++17 -Wall -Wextra -Werror -Itest-sdl/include tests/wheel_direction_fixture.cpp -o "$run/check"
          "$run/check"
