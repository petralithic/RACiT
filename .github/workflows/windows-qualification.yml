name: Windows depth-copy check
on:
  push:
    branches: [ci/windows-depth-copy]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-depth-copy
  cancel-in-progress: false
jobs:
  components:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install repository-pinned Windows tools
        shell: pwsh
        run: |
          python -m pip install --require-hashes --only-binary=:all: --retries 3 --timeout 60 -r qualification/requirements-windows.txt
      - name: Check the standalone depth-copy commit
        shell: pwsh
        run: |
          python qualification/windows.py
          exit $LASTEXITCODE
