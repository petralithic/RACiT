name: Reuse vertex layout plans
on:
  push:
    branches: ['ci/run/racit-vertex-layout-20261121']
permissions:
  contents: read
jobs:
  layout:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 3
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
      - name: Compare layout plans from the patched draw engine
        shell: bash
        run: |
          set -euo pipefail
          runtime=tools/ps3recomp
          file=libs/video/rsx_draw_engine.c
          patch=patches/ps3recomp-0001-racacit-runtime-fixes.patch
          git init -q "$runtime"
          git -C "$runtime" fetch --depth 1 https://github.com/sp00nznet/ps3recomp.git 5244db92669b54831c6d3ebb7a96d58c4dbfa6df
          git -C "$runtime" -c core.autocrlf=false checkout --detach FETCH_HEAD
          git show "8683b8c:$patch" > baseline.patch
          git -C "$runtime" apply --ignore-whitespace --include="$file" ../../baseline.patch
          extract_layout() {
            awk '/^static void eng_vertex_layout\(/ {capture=1}
                 capture {print}
                 capture && /^}/ {exit}' "$1"
          }
          extract_layout "$runtime/$file" > baseline-layout.inc
          git -C "$runtime" apply -R --ignore-whitespace --include="$file" ../../baseline.patch
          git -C "$runtime" apply --ignore-whitespace "../../$patch"
          extract_layout "$runtime/$file" > candidate-layout.inc
          awk '/^void rsx_vertex_layout_plan_init\(/ {capture=1}
               capture {print}
               capture && /^}/ {exit}' "$runtime/libs/video/rsx_vertex_compact.c" > layout-constructor.inc
          flags=(-std=gnu17 -I"$runtime/include" -I"$runtime/libs/video")
          if [[ "$RUNNER_OS" == Windows ]]; then flags+=(--target=x86_64-pc-windows-msvc); fi
          clang "${flags[@]}" -fsyntax-only "$runtime/$file"
          clang "${flags[@]}" -O2 -I. .github/tests/vertex-layout.c -o layout.exe
          ./layout.exe
