name: Shader preparation metadata paths
on:
  push:
    branches: ['ci/run/racit-relative-shaders-20261121']
permissions:
  contents: read
jobs:
  paths:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Extract the applied metadata path and writers
        shell: bash
        run: |
          set -euo pipefail
          git init -q tools/ps3recomp
          git -C tools/ps3recomp fetch --depth 1 https://github.com/sp00nznet/ps3recomp.git 5244db92669b54831c6d3ebb7a96d58c4dbfa6df
          git -C tools/ps3recomp -c core.autocrlf=false checkout --detach FETCH_HEAD
          git -C tools/ps3recomp apply --ignore-whitespace --include=libs/video/rsx_vulkan_backend.c ../../patches/ps3recomp-0001-racacit-runtime-fixes.patch
          awk '
            /^static (int vk_cache_sibling|void vk_shaders_state|void vk_prep_progress_write)\(/ { emit=1; count++ }
            emit { print; if ($0 == "}") emit=0 }
            END { if (count != 3 || emit) exit 1 }
          ' tools/ps3recomp/libs/video/rsx_vulkan_backend.c > tests/shader_metadata_paths.inc
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
      - name: Check cache path forms and generated files on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $run = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/shader-metadata-paths"
          Push-Location $run
          cl /nologo /std:c++17 /EHsc /W4 /D_CRT_SECURE_NO_WARNINGS "$env:GITHUB_WORKSPACE/tests/shader_metadata_fixture.cpp" /Fecheck.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\check.exe
          exit $LASTEXITCODE
      - name: Check cache path forms and generated files on POSIX
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          run=$(mktemp -d "$RUNNER_TEMP/shader-metadata-paths.XXXXXXXX")
          cd "$run"
          c++ -std=c++17 -Wall -Wextra -Werror "$GITHUB_WORKSPACE/tests/shader_metadata_fixture.cpp" -o check
          ./check
