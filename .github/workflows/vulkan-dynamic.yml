name: Vulkan dynamic state reuse
on:
  push:
    branches: ['ci/run/racit-vulkan-dynamic-20261121']
permissions:
  contents: read
jobs:
  commands:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 6
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
      - name: Compare Vulkan command decisions before and after
        shell: bash
        run: |
          set -euo pipefail
          root=$PWD
          run=$(mktemp -d "$RUNNER_TEMP/vulkan-dynamic.XXXXXXXX")
          patch=patches/ps3recomp-0001-racacit-runtime-fixes.patch
          file=libs/video/rsx_vulkan_backend.c
          git init -q tools/ps3recomp
          git -C tools/ps3recomp fetch --depth 1 https://github.com/sp00nznet/ps3recomp.git 5244db92669b54831c6d3ebb7a96d58c4dbfa6df
          git -C tools/ps3recomp -c core.autocrlf=false checkout --detach FETCH_HEAD
          git show "2e3ed79:$patch" > "$run/baseline.patch"
          flags=()
          if [[ "$RUNNER_OS" == Windows ]]; then flags=(--target=x86_64-pc-windows-msvc); fi
          runtime="$root/tools/ps3recomp"
          cd "$run"
          for variant in baseline candidate; do
            selected_patch="$root/$patch"
            extra=()
            if [[ "$variant" == baseline ]]; then selected_patch="$run/baseline.patch"; extra=(-DBASELINE); fi
            git -C "$runtime" apply --ignore-whitespace --include="$file" "$selected_patch"
            awk '/^static inline u32 vk_fbs\(/ { emit=1 }
                 emit && /^[/][*] Batched draw:/ { ok=1; exit }
                 emit { print } END { if (!ok) exit 1 }' "$runtime/$file" > dynamic_state.inc
            awk '/^static void vk_eng_draw_batched\(/ { batch=1 }
                 batch && /^        (if \(s_vk_foreign_bind\)|const int dyn_same =)/ { print; marker++ }
                 batch && /^        (if \(!dyn_same \|\| s_e2.dyn_w|vk_eng_set_dynamic\()/ { emit=1 }
                 emit { print }
                 emit && /^        s_e2.dyn_epoch = s_bt.epoch;/ { complete=1; exit }
                 END { if (!complete || marker!=2) exit 1 }' "$runtime/$file" > batch_dynamic.inc
            clang -std=c17 -Wall -Wextra -Werror -I. "${flags[@]}" "${extra[@]}" \
              "$root/tests/vulkan_dynamic_fixture.c" -o check.exe
            ./check.exe
            if [[ "$variant" == baseline ]]; then
              git -C "$runtime" apply -R --ignore-whitespace --include="$file" "$run/baseline.patch"
            fi
          done
