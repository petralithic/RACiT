name: Vulkan batch fence waits
on:
  push:
    branches: ['ci/run/racit-vulkan-fences-20261121']
permissions:
  contents: read
jobs:
  batch:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 3
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
      - name: Compile the patched Vulkan backend and compare its fence behavior
        shell: bash
        run: |
          set -euo pipefail
          checkout_pin() {
            mkdir -p "$1"
            git -C "$1" init -q
            git -C "$1" fetch --depth 1 "https://github.com/$2.git" "$3"
            git -C "$1" -c core.autocrlf=false checkout --detach FETCH_HEAD
          }
          runtime=tools/ps3recomp
          file=libs/video/rsx_vulkan_backend.c
          patch=patches/ps3recomp-0001-racacit-runtime-fixes.patch
          checkout_pin "$runtime" sp00nznet/ps3recomp 5244db92669b54831c6d3ebb7a96d58c4dbfa6df
          checkout_pin native-vulkan KhronosGroup/Vulkan-Headers c46850864f4661461b0f6cb9922c058ffea4915e
          checkout_pin native-sdl libsdl-org/SDL 5d249570393f7a37e037abf22cd6012a4cc56a71
          mkdir native-include
          cp -R native-sdl/include native-include/SDL2
          git show "a95b60f:$patch" > baseline.patch
          git -C "$runtime" apply --ignore-whitespace "../../$patch"
          flags=(-std=gnu17 -Inative-vulkan/include)
          if [[ "$RUNNER_OS" == Windows ]]; then flags+=(--target=x86_64-pc-windows-msvc); fi
          clang "${flags[@]}" -Inative-include -I"$runtime/include" -DPS3RECOMP_RSX_VULKAN -fsyntax-only "$runtime/$file"
          cp "$runtime/$file" candidate.c
          git -C "$runtime" apply -R --ignore-whitespace --include="$file" "../../$patch"
          git -C "$runtime" apply --ignore-whitespace --include="$file" ../../baseline.patch
          cp "$runtime/$file" baseline.c
          cp .github/tests/vulkan-fence.c fence-check.c
          extract() {
            awk '/^\/\* RSX_ENG_STATS: where the render thread waits/{section=1}
                 /^\/\* Bump-allocate/{if (section) exit}
                 section{print}' "$1" > wait-section.inc
          }
          extract baseline.c
          clang "${flags[@]}" -DBASELINE fence-check.c -o baseline.exe
          ./baseline.exe
          extract candidate.c
          clang "${flags[@]}" fence-check.c -o candidate.exe
          ./candidate.exe
