name: Scripted pad takeover
on:
  push:
    branches: ['ci/run/racit-scripted-pad-20261121']
permissions:
  contents: read
jobs:
  pad:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Extract the applied pad poll and script queue
        shell: bash
        run: |
          set -euo pipefail
          git init -q tools/ps3recomp
          git -C tools/ps3recomp fetch --depth 1 https://github.com/sp00nznet/ps3recomp.git 5244db92669b54831c6d3ebb7a96d58c4dbfa6df
          git -C tools/ps3recomp -c core.autocrlf=false checkout --detach FETCH_HEAD
          git -C tools/ps3recomp apply --ignore-whitespace --include=libs/input/cellPad.c ../../patches/ps3recomp-0001-racacit-runtime-fixes.patch
          src=tools/ps3recomp/libs/input/cellPad.c
          awk '/^#define PAD_HUMAN_HOLD_MS/ { emit=1 }
               emit { print; if (/^static void pad_poll_backend\(/) poll=1; if (poll && $0 == "}") exit }' "$src" > tests/scripted_pad_poll.inc
          awk '/static int s_pf = -1; static char pf_path/ { emit=1 }
               emit { print; if ($0 == "       } }") exit }' "$src" > tests/scripted_pad_file.inc
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
      - name: Check scripted and physical pad modes on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $run = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/scripted-pad-takeover"
          Push-Location $run
          cl /nologo /std:c++17 /EHsc /W4 /D_CRT_SECURE_NO_WARNINGS "$env:GITHUB_WORKSPACE/tests/scripted_pad_fixture.cpp" /Fecheck.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\check.exe scripted
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\check.exe physical
          exit $LASTEXITCODE
      - name: Check scripted and physical pad modes on POSIX
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          run=$(mktemp -d "$RUNNER_TEMP/scripted-pad-takeover.XXXXXXXX")
          cd "$run"
          c++ -std=c++17 -Wall -Wextra -Werror "$GITHUB_WORKSPACE/tests/scripted_pad_fixture.cpp" -o check
          ./check scripted
          ./check physical
