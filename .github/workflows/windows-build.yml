# Windows build checks that need no game data: the launcher, the ps3recomp runtime with
# this repository's patch, and the tests, with MSVC (native cl) and with the release
# toolchain (zig's clang, scripts/setup_windows.sh). The game itself needs a lift of the
# player's own EBOOT, so it is not built here.
name: Windows build
# Runs only when started on purpose, to save CI minutes: push the commit to check to a
# branch named ci/run/<name> (GitHub can't dispatch a workflow that isn't on the default branch).
on:
  push:
    branches: ['ci/run/**']
  workflow_dispatch:
permissions:
  contents: read
env:
  PS3RECOMP_COMMIT: 5244db92669b54831c6d3ebb7a96d58c4dbfa6df   # scripts/setup_windows.sh
  VULKAN_HEADERS_COMMIT: c46850864f4661461b0f6cb9922c058ffea4915e
  SDL2_VERSION: 2.32.10

jobs:
  unit-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: '3.12'
      - name: tests/*.py (clang++ from the runner's LLVM builds the C++ harnesses)
        shell: bash
        run: |
          export PATH="/c/Program Files/LLVM/bin:$PATH"
          clang++ --version | head -1
          python -X utf8 -m unittest discover -s tests -v

  msvc:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756   # v1.13.0
      - name: SDL2 (VC development package)
        shell: pwsh
        run: |
          $v = $env:SDL2_VERSION
          Invoke-WebRequest "https://github.com/libsdl-org/SDL/releases/download/release-$v/SDL2-devel-$v-VC.zip" -OutFile sdl.zip
          Expand-Archive sdl.zip -DestinationPath sdl
          New-Item -ItemType Directory -Force sdlinc | Out-Null
          Copy-Item -Recurse "sdl/SDL2-$v/include" sdlinc/SDL2
      - name: Launcher (cl)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force launcher/build | Out-Null
          python -I launcher/make_icon.py launcher/build/icon.ico
          rc /nologo /fo launcher/build/launcher.res launcher/src/launcher.rc
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $v = $env:SDL2_VERSION
          cl /nologo /std:c++17 /O2 /EHsc /utf-8 /W3 /DUNICODE /D_UNICODE /DSDL_MAIN_HANDLED /Isdlinc `
            launcher/src/app.cpp launcher/src/gfx.cpp launcher/src/iso.cpp launcher/src/store.cpp launcher/src/util.cpp `
            launcher/build/launcher.res /Fo"launcher/build/" /Fe"launcher/build/RaCACiT Launcher.exe" `
            /link /SUBSYSTEM:WINDOWS /LIBPATH:"sdl/SDL2-$v/lib/x64" SDL2.lib d2d1.lib dwrite.lib windowscodecs.lib `
            ole32.lib oleaut32.lib uuid.lib shell32.lib shlwapi.lib winhttp.lib bcrypt.lib setupapi.lib imm32.lib `
            version.lib winmm.lib gdi32.lib user32.lib advapi32.lib
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item "sdl/SDL2-$v/lib/x64/SDL2.dll" launcher/build/
      - name: The launcher starts (--self-test)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "launcher/build/RaCACiT Launcher.exe" -ArgumentList '--self-test' -PassThru -Wait
          "self-test exit code: $($p.ExitCode)"
          exit $p.ExitCode
      - name: tests/ (desktop_mouse_test)
        shell: pwsh
        run: |
          cmake -S tests -B build/tests -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/tests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir build/tests --output-on-failure

  msvc-runtime:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756   # v1.13.0
      - name: Pinned ps3recomp with the runtime patch, Vulkan headers
        shell: bash
        run: |
          for r in "ps3recomp sp00nznet/ps3recomp $PS3RECOMP_COMMIT" "Vulkan-Headers KhronosGroup/Vulkan-Headers $VULKAN_HEADERS_COMMIT"; do
            set -- $r
            git init -q "tools/$1"
            git -C "tools/$1" fetch -q --depth 1 "https://github.com/$2" "$3"
            git -C "tools/$1" checkout -q FETCH_HEAD
          done
          bash scripts/update_runtime_patch.sh "$PWD/tools/ps3recomp" "$PWD/patches/ps3recomp-0001-racacit-runtime-fixes.patch"
      - name: SDL2 (VC development package)
        shell: pwsh
        run: |
          $v = $env:SDL2_VERSION
          Invoke-WebRequest "https://github.com/libsdl-org/SDL/releases/download/release-$v/SDL2-devel-$v-VC.zip" -OutFile sdl.zip
          Expand-Archive sdl.zip -DestinationPath sdl
      - name: ps3recomp runtime (cl, Vulkan RSX, SDL2 pad/audio)
        shell: pwsh
        run: |
          cmake -S tools/ps3recomp -B build/runtime -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DPS3RECOMP_RSX_VULKAN=ON -DPS3RECOMP_WIN_USE_SDL2=ON `
            -DPS3RECOMP_VULKAN_INCLUDE_DIR="$PWD/tools/Vulkan-Headers/include" `
            -DSDL2_DIR="$PWD/sdl/SDL2-$env:SDL2_VERSION/cmake"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/runtime --target ps3recomp_runtime -- -k 0

  zig:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: '3.12'
      - name: scripts/setup_windows.sh
        shell: bash
        run: PYTHON=python bash scripts/setup_windows.sh
      - name: launcher/build.sh
        shell: bash
        run: bash launcher/build.sh
      - name: The launcher starts (--self-test)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "launcher/build/RaCACiT Launcher.exe" -ArgumentList '--self-test' -PassThru -Wait
          "self-test exit code: $($p.ExitCode)"
          exit $p.ExitCode
      - name: tests/ with windows/toolchain/zig-windows.cmake
        shell: bash
        run: |
          export PATH="$PWD/tools/venv/Scripts:$PATH"
          cmake -S tests -B build/tests -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/windows/toolchain/zig-windows.cmake"
          cmake --build build/tests
          ctest --test-dir build/tests --output-on-failure
      - name: ps3recomp runtime with windows/toolchain/zig-windows.cmake
        shell: bash
        run: |
          export PATH="$PWD/tools/venv/Scripts:$PATH"
          cmake -S tools/ps3recomp -B build/runtime -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/windows/toolchain/zig-windows.cmake" \
            -DPS3RECOMP_RSX_VULKAN=ON -DPS3RECOMP_WIN_USE_SDL2=ON \
            -DPS3RECOMP_VULKAN_INCLUDE_DIR="$PWD/tools/Vulkan-Headers/include" \
            -DSDL2_DIR="$PWD/tools/sdl2-win/lib/cmake/SDL2"
          cmake --build build/runtime --target ps3recomp_runtime -- -k 0
