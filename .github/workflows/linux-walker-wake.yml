name: Desktop graphics worker wake
on:
  push:
    branches: ['ci/run/racit-linux-wake-20261121']
permissions:
  contents: read
jobs:
  wake:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Extract the actual graphics worker wake path
        shell: bash
        run: |
          set -euo pipefail
          git init -q tools/ps3recomp
          git -C tools/ps3recomp fetch --depth 1 https://github.com/sp00nznet/ps3recomp.git 5244db92669b54831c6d3ebb7a96d58c4dbfa6df
          git -C tools/ps3recomp -c core.autocrlf=false checkout --detach FETCH_HEAD
          git -C tools/ps3recomp apply --ignore-whitespace --include='runtime/platform/win32_compat.*' ../../patches/ps3recomp-0001-racacit-runtime-fixes.patch
          awk '/^\/\* The FIFO walker runs on frame_clock/ { emit=1 }
               emit { print; if ($0 == "#endif") { done=1; exit } }
               END { if (!done) exit 1 }' game/main.cpp > tests/graphics_wake_decls.inc
          awk '/^static DWORD WINAPI frame_clock\(LPVOID\)/ { clock=1 }
               clock && /^#if defined\(_WIN32\) \|\| defined\(__ANDROID__\)$/ { emit=1 }
               emit { print; if ($0 == "#endif") { done=1; exit } }
               END { if (!done) exit 1 }' game/main.cpp > tests/graphics_wake_init.inc
          awk '/^    static DWORD s_poll_ms/ { poll=1 }
               poll && /^#if defined\(_WIN32\) \|\| defined\(__APPLE__\) \|\| defined\(__linux__\)$/ { emit=1 }
               emit && /^        ULONGLONG now =/ { done=1; exit }
               emit { print }
               END { if (!done) exit 1 }' game/main.cpp > tests/graphics_wake_wait.inc
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
      - name: Exercise the native event path and platform defaults on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $run = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/graphics-wake"
          cl /nologo /std:c++17 /EHsc /W4 /D_CRT_SECURE_NO_WARNINGS /Itools/ps3recomp/runtime/platform tests/graphics_wake_fixture.cpp /Fo"$run/check.obj" /Fe"$run/check.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($mode in @("default", "enabled", "disabled")) {
            & "$run/check.exe" $mode
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Exercise native event waits and platform defaults on POSIX
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          run=$(mktemp -d "$RUNNER_TEMP/graphics-wake.XXXXXXXX")
          platform=tools/ps3recomp/runtime/platform
          cc -std=gnu11 -pthread -c "$platform/win32_compat.c" -o "$run/compat.o"
          c++ -std=c++17 -Wall -Wextra -Werror -pthread -I"$platform" tests/graphics_wake_fixture.cpp "$run/compat.o" -o "$run/check"
          for mode in default enabled disabled; do "$run/check" "$mode"; done
