name: Vulkan framebuffer reuse
on:
  push:
    branches: ['ci/run/racit-framebuffer-reuse-20261121']
permissions:
  contents: read
jobs:
  lookup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 6
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
      - name: Compare framebuffer lookup and invalidation before and after
        shell: bash
        run: |
          set -euo pipefail
          root=$PWD
          run=$(mktemp -d "$RUNNER_TEMP/framebuffer-reuse.XXXXXXXX")
          patch=patches/ps3recomp-0001-racacit-runtime-fixes.patch
          file=libs/video/rsx_vulkan_backend.c
          git init -q tools/ps3recomp
          git -C tools/ps3recomp fetch --depth 1 https://github.com/sp00nznet/ps3recomp.git 5244db92669b54831c6d3ebb7a96d58c4dbfa6df
          git -C tools/ps3recomp -c core.autocrlf=false checkout --detach FETCH_HEAD
          git show "1d4b346:$patch" > "$run/baseline.patch"
          flags=(-std=c17 -Wall -Wextra -Werror -I.)
          if [[ "$RUNNER_OS" == Windows ]]; then flags+=(--target=x86_64-pc-windows-msvc); fi
          runtime="$root/tools/ps3recomp"
          extract() {
            awk -v sig="$1" 'index($0,sig)==1 && $0 !~ /;[[:space:]]*$/ { print; on=1; next }
                on { print; if ($0=="}") { done=1; exit } }
                END { if (!done) exit 1 }' "$runtime/$file"
          }
          cd "$run"
          for variant in baseline candidate; do
            selected_patch="$root/$patch"
            extra=(-UBASELINE)
            if [[ "$variant" == baseline ]]; then selected_patch="$run/baseline.patch"; extra=(-DBASELINE); fi
            git -C "$runtime" apply --ignore-whitespace --include="$file" "$selected_patch"
            grep '^#define VK_ENG_FB_CACHE ' "$runtime/$file" > framebuffer_limit.inc
            {
              extract 'static void vk_eng_drop_framebuffers_using(u32 handle)'
              extract 'static void vk_eng_drop_framebuffers(void)'
              extract 'static VkFramebuffer vk_eng_framebuffer('
            } > framebuffer_source.inc
            clang "${flags[@]}" "${extra[@]}" "$root/tests/framebuffer_lookup_fixture.c" -o check.exe
            ./check.exe
            if [[ "$variant" == baseline ]]; then
              git -C "$runtime" apply -R --ignore-whitespace --include="$file" "$run/baseline.patch"
            fi
          done
