[package]
name = "racit-release"
version = "0.1.0"
edition = "2024"
description = "Builds, checks and drafts a RACiT release (macOS and Windows zips) from a tag, locally"
publish = false

[dependencies]
anyhow = "1.0.105"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.2.2"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }
